name: Deploy to VPS

on:
  push:
    branches:
      - main # O deploy será acionado automaticamente ao fazer push na branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Push Database Schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Project
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_URL: "https://vitababy.com.br"
          # Adicione outras variáveis de ambiente necessárias para o build aqui

      - name: Compress Build Files
        run: tar -czf deploy.tar.gz .next public package.json next.config.ts prisma package-lock.json

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "deploy.tar.gz"
          target: "/www/wwwroot/vitababy"

      - name: Execute SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -ex
            export PATH=$PATH:/www/server/nodejs/v24.21.0/bin
            cd /www/wwwroot/vitababy
            tar -xzf deploy.tar.gz
            
            # Instala apenas dependências de produção para economizar RAM
            npm ci --omit=dev
            # Instala o CLI do prisma manualmente ignorando os scripts do husky
            npm install prisma --no-save --ignore-scripts
            
            # Cria o arquivo .env com a string de conexão para que o Prisma e o Next.js consigam acessar o banco na VPS
            echo 'DATABASE_URL="${{ secrets.DATABASE_URL }}"' > .env
            echo 'NEXT_PUBLIC_URL="https://vitababy.com.br"' >> .env
            
            # Gera o client do Prisma compilado para a arquitetura da VPS
            npx prisma generate
            rm deploy.tar.gz
            
            # Remove o processo antigo do pm2 para ele aceitar o novo comando de inicialização
            pm2 delete vitababy || true
            
            # Garante que a porta 3000 está livre
            npx --yes kill-port 3000 || fuser -k 3000/tcp || true
            
            # Inicia o next diretamente pelo pm2 para evitar processos órfãos do npm
            pm2 start node_modules/next/dist/bin/next --name "vitababy" -- start
            pm2 save
