name: Deploy to HostGator

on:
  push:
    branches:
      - main
      - master # Caso sua branch principal se chame master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do codigo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Criar arquivo .env
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          # Adicione outras variaveis aqui embaixo caso necessario no futuro
          # echo "OUTRA_VARIAVEL=${{ secrets.OUTRA_VARIAVEL }}" >> .env

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🗄️ Gerar Prisma Client
        run: npx prisma generate

      - name: 🏗️ Fazer a Build (Next.js)
        run: npm run build

      - name: 📂 Preparar arquivos Standalone
        run: |
          # O Next.js exige que copiemos essas pastas manualmente para o modo standalone
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/* .next/standalone/.next/static/
          cp .env .next/standalone/.env

      - name: 🚀 Deploy via FTP para HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /vitababy-app/ # Nome da pasta que vamos criar no cPanel
          local-dir: .next/standalone/
